<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager – Kayıt Ol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

<div class="auth-page">
    <div class="auth-top">
        <div class="auth-circle auth-circle-left"></div>
        <div class="auth-circle auth-circle-right"></div>

        <div class="auth-header">
            <div class="auth-logo">📋</div>
            <h1>Task Manager</h1>
            <p>Yeni hesap oluştur</p>
        </div>
    </div>

    <div class="auth-card">
        <h2>Register</h2>

        <div class="form-group">
            <label>Hesap Türü</label>
            <div class="filter-tabs">
                <button type="button" class="filter-tab" data-role="MANAGER" onclick="selectRole('MANAGER')">👔 Yönetici Olarak Kaydol</button>
                <button type="button" class="filter-tab active" data-role="WORKER" onclick="selectRole('WORKER')">🧑‍💻 Çalışan Olarak Kaydol</button>
            </div>
            <input type="hidden" id="role" value="WORKER">
        </div>

        <div class="form-group">
            <label>Ad Soyad</label>
            <input type="text" id="fullName" placeholder="Adın ve soyadın">
        </div>

        <div class="form-group">
            <label>E-posta</label>
            <input type="email" id="email" placeholder="ornek@eposta.com">
        </div>

        <div class="form-group">
            <label>Kullanıcı Adı</label>
            <input type="text" id="username" placeholder="Kullanıcı adı oluştur">
        </div>

        <div class="form-group">
            <label id="phoneLabel">Telefon (opsiyonel)</label>
            <input type="text" id="phone" placeholder="05xx xxx xx xx">
        </div>

        <div id="managerFields" style="display:none">
            <div class="form-group">
                <label>Şirket / Departman</label>
                <input type="text" id="company" placeholder="Şirket veya departman adı">
            </div>

            <div class="form-group">
                <label>Pozisyon / Ünvan (opsiyonel)</label>
                <input type="text" id="position" placeholder="Ör. Takım Lideri">
            </div>

            <div class="form-group">
                <label>Davet Kodu</label>
                <input type="text" id="inviteCode" placeholder="Şirketinden aldığın davet kodu">
            </div>
        </div>

        <div class="form-group">
            <label>Şifre</label>
            <input type="password" id="password" placeholder="Şifre oluştur">
        </div>

        <div class="form-group">
            <label>Şifre (Tekrar)</label>
            <input type="password" id="confirmPassword" placeholder="Şifreni tekrar gir">
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" id="acceptedTerms">
                Kullanım şartlarını kabul ediyorum
            </label>
        </div>

        <button class="primary-btn full-btn" id="registerBtn" onclick="register()">Kayıt Ol</button>
        <p class="auth-status" id="authStatus"></p>

        <p class="auth-switch">
            Zaten hesabın var mı? <a href="login.html">Giriş Yap</a>
        </p>
    </div>
</div>

<script src="auth.js"></script>
</body>
</html>
