<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-shell">

    <header class="hero">
        <div class="hero-circle hero-circle-left"></div>
        <div class="hero-circle hero-circle-right"></div>

        <div class="hero-topbar">
            <span id="roleBadge" class="priority-badge"></span>
            <button class="logout-icon-btn" onclick="toggleNotifications()">🔔<span id="notifBadge" class="notif-count" style="display:none"></span></button>
            <button class="logout-icon-btn" onclick="logout()">Çıkış</button>
        </div>

        <div class="hero-content">
            <h1>Yapılacaklar 🍂</h1>
            <p>Görevlerini düzenli ve şık bir şekilde yönet</p>
        </div>
    </header>

    <main class="content-area">

        <section id="managerAssignPanel" class="task-panel" style="display:none">
            <div class="section-head">
                <h2>👔 Görev Ata</h2>
            </div>
            <div class="task-row">
                <select id="assigneeSelect" class="soft-input flex-grow"></select>
                <input type="text" id="assignTitle" class="soft-input flex-grow" placeholder="🌸 Görev başlığı">
                <input type="text" id="assignDescription" class="soft-input flex-grow" placeholder="📝 Açıklama">
                <input type="date" id="assignDueDate" class="soft-input small-input">
                <select id="assignPriority" class="soft-input small-input">
                    <option value="low">Düşük</option>
                    <option value="medium">Orta</option>
                    <option value="high">Yüksek</option>
                </select>
                <button class="add-btn" onclick="assignTodo()">Ata</button>
            </div>
        </section>

        <section id="assignedByMeSection" class="todo-section" style="display:none">
            <div class="section-head">
                <h2>📋 Atadıklarım</h2>
            </div>
            <div id="assignedByMeList" class="todo-list"></div>
        </section>

        <section id="personalTaskPanel" class="task-panel">
            <div class="task-row">
                <input type="text" id="title" class="soft-input flex-grow" placeholder="🌸 Görev başlığı">
                <input type="text" id="description" class="soft-input flex-grow" placeholder="📝 Açıklama">
                <input type="date" id="dueDate" class="soft-input small-input">
                <select id="priority" class="soft-input small-input">
                    <option value="low">Düşük</option>
                    <option value="medium">Orta</option>
                    <option value="high">Yüksek</option>
                </select>
                <button class="add-btn" onclick="addTodo()">+</button>
            </div>
        </section>

        <section id="personalTodoSection" class="todo-section">
            <div class="section-head">
                <h2>Görev Listesi</h2>
                <span id="todoCounter" class="todo-counter"></span>
            </div>

            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">Tümü</button>
                <button class="filter-tab" data-filter="active" onclick="setFilter('active')">Aktif</button>
                <button class="filter-tab" data-filter="completed" onclick="setFilter('completed')">Tamamlanan</button>
            </div>

            <div id="todoList" class="todo-list"></div>
        </section>

    </main>
</div>

<div id="modal" class="modal">
    <div class="modal-content custom-modal">
        <h3>Görev Güncelle</h3>

        <input type="text" id="editTitle" class="soft-input" placeholder="Başlık">
        <input type="text" id="editDesc" class="soft-input" placeholder="Açıklama">
        <input type="date" id="editDueDate" class="soft-input">
        <select id="editPriority" class="soft-input">
            <option value="low">Düşük</option>
            <option value="medium">Orta</option>
            <option value="high">Yüksek</option>
        </select>


        <div class="modal-actions">
            <button class="primary-btn" onclick="saveUpdate()">Kaydet</button>
            <button class="secondary-btn" onclick="closeModal()">İptal</button>
        </div>
    </div>
</div>

<div id="notifModal" class="modal">
    <div class="modal-content custom-modal">
        <h3>🔔 Bildirimler</h3>

        <div id="notifList" class="todo-list"></div>

        <div class="modal-actions">
            <button class="primary-btn" onclick="markAllNotificationsRead()">Tümünü Okundu İşaretle</button>
            <button class="secondary-btn" onclick="closeNotifications()">Kapat</button>
        </div>
    </div>
</div>

<script src="todos.js"></script>
</body>
</html>
