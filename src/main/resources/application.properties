
spring.application.name=test2todolist
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/todo_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:mysupersecretkeymysupersecretkey}

manager.invite-code=${MANAGER_INVITE_CODE:YONETICI2026}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:63342}